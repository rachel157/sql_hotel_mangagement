services:
  postgres:
    image: postgres:16
    container_name: hotel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel123
      POSTGRES_DB: hotelmanagement
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      # Các file *.sql trong init/ tự chạy theo thứ tự tên khi volume data còn trống
      - ./init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotelmanagement"]
      interval: 5s
      timeout: 3s
      retries: 20

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:latest
    container_name: hotel-dbt
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Trỏ đường dẫn để dbt đọc file profiles.yml trong cùng thư mục project
      - DBT_PROFILES_DIR=/usr/app/dbt_hotel
    volumes:
      # Mount thư mục dbt_hotel từ máy thật vào container
      - ./dbt_hotel:/usr/app/dbt_hotel
    working_dir: /usr/app/dbt_hotel
    # Ghi đè entrypoint mặc định để giữ container dbt luôn chạy ngầm
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  pgdata: